services:
  # Backend FastAPI Web Service
  - type: web
    name: medilens-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./medilens.db
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site
  - type: static
    name: medilens-frontend
    rootDir: client
    buildCommand: "npm run build"
    publishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medilens-backend
          property: host
